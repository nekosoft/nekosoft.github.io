<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}html,body{height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>LLM Hacking</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a single scrolling storybook. Two views — a winding trail map of 12
   guardian bots, and a chapter page per bot. Treatment: warm paper, rounded
   friendly type, one coral accent, each bot its own candy hue. */
:root{
  --bg:#eef1f4; --bg2:#e4e8ed; --panel:#ffffff; --panel2:#f2f4f7;
  --ink:#1b2430; --muted:#5a6672; --faint:#9099a5;
  --line:#e0e4e9; --line2:#cbd2da;
  --accent:#e4583a; --accent-ink:#ffffff; --accent-soft:#f8e2db;
  --teal:#0f9e8d; --gold:#bf8a16; --good:#2f8f57; --warm:#c46f1e; --bad:#cf4a37;
  --code:#eef1f5;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 6px 18px rgba(20,30,45,.07);
  --shadow-sm:0 1px 2px rgba(20,30,45,.05);
  --round:10px;
  --disp:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --bg2:#171c24; --panel:#1a2029; --panel2:#212834;
  --ink:#e7ecf1; --muted:#9aa6b2; --faint:#64717f;
  --line:#28313c; --line2:#3a4552;
  --accent:#ff7753; --accent-ink:#1a110c; --accent-soft:#3a241c;
  --teal:#2cc4b2; --gold:#dcae4f; --good:#5cc07e; --warm:#e2975a; --bad:#ef7a63;
  --code:#10151c;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12161c; --bg2:#171c24; --panel:#1a2029; --panel2:#212834;
  --ink:#e7ecf1; --muted:#9aa6b2; --faint:#64717f;
  --line:#28313c; --line2:#3a4552;
  --accent:#ff7753; --accent-ink:#1a110c; --accent-soft:#3a241c;
  --teal:#2cc4b2; --gold:#dcae4f; --good:#5cc07e; --warm:#e2975a; --bad:#ef7a63;
  --code:#10151c;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;font-weight:400;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--disp);font-weight:600;margin:0;letter-spacing:.2px;line-height:1.15}
a{color:var(--accent);text-decoration:none;font-weight:700}
a:hover{text-decoration:underline}
button{font-family:var(--body);font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
.wrap{max-width:960px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px))}

/* ---- top bar ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(10px);
  border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:35}
.bar .wrap{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:56px}
.home{display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;color:var(--ink);padding:4px}
.home .logo{width:34px;height:34px;flex:none}
.home .wordmark{font-family:var(--disp);font-weight:700;font-size:17px}
.home .wordmark small{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:-2px}
.bar .spacer{flex:1}
.stars{display:flex;align-items:center;gap:7px;background:var(--panel2);border:2px solid var(--line);
  border-radius:999px;padding:5px 12px 5px 10px;font-family:var(--disp);font-size:13px}
.stars svg{width:18px;height:18px}
.iconbtn{width:38px;height:38px;border:2px solid var(--line);background:var(--panel);border-radius:12px;
  cursor:pointer;color:var(--ink);font-size:15px;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--accent);transform:translateY(-1px)}

/* ---- map / hero ---- */
.view{padding:0 0 80px}
.hero{text-align:center;padding:40px 0 10px}
.kicker{display:inline-block;background:var(--accent-soft);color:var(--accent);font-family:var(--disp);font-weight:600;
  font-size:13px;padding:6px 15px;border-radius:999px;border:2px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
.hero h1{font-size:clamp(34px,7vw,58px);margin:18px 0 0;font-weight:700;text-wrap:balance}
.hero p{max-width:40ch;margin:16px auto 0;font-size:17px;color:var(--muted)}
.hero .peek{display:flex;justify-content:center;gap:-14px;margin-top:24px}
.hero .peek .mini{width:58px;height:58px;margin-left:-12px;filter:drop-shadow(0 4px 6px rgba(90,60,25,.18))}
.hero .peek .mini:first-child{margin-left:0}
.hero .peek .mini{transition:transform .18s}
.hero .peek:hover .mini{transform:translateY(-3px)}

/* the way */
.way{background:var(--panel);border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow);
  padding:22px 22px 24px;margin:30px 0 10px}
.way h2{font-size:21px;text-align:center}
.way .sub{text-align:center;color:var(--muted);font-size:14px;margin-top:4px}
.way .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.way .s{text-align:center}
.way .s .b{width:50px;height:50px;margin:0 auto;border-radius:16px;display:grid;place-items:center;
  font-family:var(--disp);font-weight:700;font-size:20px;color:#fff;box-shadow:var(--shadow-sm)}
.way .s:nth-child(1) .b{background:#ef7a52}
.way .s:nth-child(2) .b{background:#e6ac34}
.way .s:nth-child(3) .b{background:#28b2a2}
.way .s:nth-child(4) .b{background:#9a7bd8}
.way .s .t{font-family:var(--disp);font-weight:600;font-size:16px;margin-top:10px}
.way .s .d{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}

.trailhead{text-align:center;margin:44px 0 8px}
.trailhead h2{font-size:26px}
.trailhead p{color:var(--muted);margin-top:4px}

/* ---- trail ---- */
.trail{position:relative;margin-top:18px;padding:10px 0}
.trail::before{content:"";position:absolute;top:10px;bottom:30px;left:50%;transform:translateX(-50%);width:0;
  border-left:4px dashed var(--line2)}
.stop{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;width:100%;background:none;border:0;
  cursor:pointer;padding:9px 0;color:var(--ink);text-align:left}
.node{grid-column:2;justify-self:center;position:relative;z-index:2}
.node .av{width:76px;height:76px;background:var(--panel);border:3px solid var(--line2);border-radius:50%;
  padding:5px;box-shadow:0 2px 6px rgba(0,0,0,.14);transition:transform .18s,border-color .18s}
.stop:hover .node .av{transform:scale(1.08);border-color:var(--accent)}
.node .mk{position:absolute;right:-4px;top:-4px;width:26px;height:26px;border-radius:50%;background:var(--panel);
  border:2px solid var(--line2);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:12px;color:var(--muted)}
.stop.done .node .mk{background:var(--gold);border-color:var(--gold);color:#5a3d00}
.stop.done .node .av{border-color:var(--gold)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:13px 16px;box-shadow:var(--shadow-sm);
  transition:transform .18s,box-shadow .18s;max-width:340px;display:flex;flex-direction:column;gap:2px}
.card .wk,.card .nm,.card .hk{display:block}
.stop:hover .card{transform:translateY(-2px);box-shadow:var(--shadow)}
.stop.left .card{grid-column:1;justify-self:end}
.stop.right .card{grid-column:3;justify-self:start}
.card .wk{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
.card .nm{font-family:var(--disp);font-weight:600;font-size:18px;margin-top:1px}
.card .hk{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4}
.stop.left .card .wk,.stop.left .card .nm,.stop.left .card .hk{text-align:right}

.finale{text-align:center;margin-top:10px;color:var(--muted);font-size:14px}
.finale .heart{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ---- chapter ---- */
.chap{padding-top:26px}
.back{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:2px solid var(--line);
  border-radius:999px;padding:7px 15px 7px 11px;font-size:13px;color:var(--ink);cursor:pointer}
.back:hover{border-color:var(--accent)}
.chap-hero{display:flex;gap:20px;align-items:center;margin-top:18px;flex-wrap:wrap}
.chap-hero .big{width:118px;height:118px;flex:none;background:var(--panel);border:3px solid var(--line2);
  border-radius:30px;padding:8px;box-shadow:var(--shadow)}
.chap-hero .meta{min-width:220px;flex:1}
.chap-hero .ch{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--accent)}
.chap-hero h1{font-size:clamp(28px,6vw,42px);margin:3px 0 0}
.chap-hero .sub{color:var(--muted);font-size:15px;margin-top:4px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.3px;padding:4px 11px;border-radius:999px;
  background:var(--panel2);border:2px solid var(--line);color:var(--muted)}
.chip.track{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,var(--line));color:var(--accent)}

.bubble{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px 20px;
  margin-top:22px;box-shadow:var(--shadow-sm);font-size:17px;line-height:1.55}
.bubble::before{content:"";position:absolute;top:-12px;left:34px;width:22px;height:22px;background:var(--panel);
  border-left:2px solid var(--line);border-top:2px solid var(--line);transform:rotate(45deg)}

.block{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px 20px;margin-top:16px;box-shadow:var(--shadow-sm)}
.block > h3{font-family:var(--disp);font-weight:600;font-size:17px;display:flex;align-items:center;gap:9px}
.block > h3 .dot{width:11px;height:11px;border-radius:50%;background:var(--accent)}
.guard{font-size:16.5px;margin-top:8px;line-height:1.5}
.bag{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.bag .it{font-size:13px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:5px 11px;color:var(--muted)}

.moves{list-style:none;margin:6px 0 0;padding:0;counter-reset:m}
.moves li{position:relative;padding:12px 0 12px 46px;border-top:2px dotted var(--line)}
.moves li:first-child{border-top:0}
.moves li::before{counter-increment:m;content:counter(m);position:absolute;left:0;top:11px;width:30px;height:30px;border-radius:12px;
  background:var(--accent-soft);color:var(--accent);font-family:var(--disp);font-weight:700;font-size:15px;display:grid;place-items:center;
  border:2px solid color-mix(in srgb,var(--accent) 25%,var(--line))}
.moves li .mt{font-family:var(--disp);font-weight:600;font-size:15.5px}
.moves li .md{font-size:14px;color:var(--muted);margin-top:1px}

.winwhen{display:flex;gap:11px;align-items:flex-start;background:color-mix(in srgb,var(--good) 12%,var(--panel));
  border:2px solid color-mix(in srgb,var(--good) 35%,var(--line));border-radius:18px;padding:14px 16px;margin-top:16px;font-size:14.5px}
.winwhen b{color:var(--good)}
.winwhen .st{font-size:20px;line-height:1}

/* journal */
.jrow{display:flex;justify-content:space-between;align-items:center}
.jrow .saved{font-family:var(--disp);font-size:12px;color:var(--good);opacity:0;transition:opacity .2s}
.jrow .saved.show{opacity:1}
.field{margin-top:14px}
.field label{display:block;font-family:var(--disp);font-weight:600;font-size:14px;margin-bottom:6px}
.field label .h{font-weight:400;color:var(--faint);font-size:12.5px;font-family:var(--body)}
textarea{width:100%;background:var(--code);border:2px solid var(--line2);border-radius:14px;padding:11px 13px;color:var(--ink);
  font-family:var(--mono);font-size:13px;line-height:1.55;resize:vertical;min-height:62px;font-weight:400}
textarea:focus{border-color:var(--accent)}
.out{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.seg{border:2px solid var(--line2);background:var(--panel);color:var(--muted);border-radius:13px;padding:8px 14px;font-size:13.5px;
  cursor:pointer;font-family:var(--disp);font-weight:600;display:flex;align-items:center;gap:7px}
.seg:hover{transform:translateY(-1px)}
.seg[aria-pressed=true][data-v=nope]{background:var(--bad);border-color:var(--bad);color:#fff}
.seg[aria-pressed=true][data-v=warm]{background:var(--warm);border-color:var(--warm);color:#fff}
.seg[aria-pressed=true][data-v=open]{background:var(--good);border-color:var(--good);color:#fff}

/* reveals */
details.rev{margin-top:14px;border:2px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow-sm)}
details.rev > summary{list-style:none;cursor:pointer;padding:15px 18px;font-family:var(--disp);font-weight:600;font-size:15px;
  display:flex;align-items:center;gap:11px;user-select:none}
details.rev > summary::-webkit-details-marker{display:none}
details.rev > summary .ic{width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:16px}
details.rev.whisper > summary .ic{background:var(--accent-soft)}
details.rev.scroll > summary .ic{background:color-mix(in srgb,var(--bad) 16%,var(--panel))}
details.rev > summary .cap{margin-left:auto;font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.4px;text-transform:uppercase;
  color:var(--faint);background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:3px 10px}
details.rev > summary .car{transition:transform .2s;color:var(--muted);font-size:13px}
details.rev[open] > summary .car{transform:rotate(90deg)}
.rbody{padding:4px 18px 18px;font-size:14.5px}
.rbody.spoil{border-top:2px dashed color-mix(in srgb,var(--bad) 40%,var(--line))}
.rbody ol,.rbody ul{margin:10px 0;padding-left:20px}
.rbody li{margin:6px 0}
.rbody code{font-family:var(--mono);font-size:12.5px;background:var(--code);padding:1px 6px;border-radius:6px;font-weight:600}
.keynote{font-size:12.5px;color:var(--muted);margin-top:13px;padding-top:11px;border-top:2px dotted var(--line);line-height:1.5}

/* badge + nav */
.finish{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:22px}
.badgebtn{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--line2);background:var(--panel);color:var(--ink);
  padding:12px 20px;border-radius:16px;font-family:var(--disp);font-weight:600;font-size:15px;cursor:pointer;box-shadow:var(--shadow-sm)}
.badgebtn:hover{transform:translateY(-2px);border-color:var(--gold)}
.badgebtn.got{background:var(--gold);border-color:var(--gold);color:#5a3d00}
.badgebtn svg{width:20px;height:20px}
.mile{flex:1;min-width:200px;font-size:13.5px;color:var(--muted)}
.mile b{color:var(--ink);font-family:var(--disp);font-weight:600}
.pager{display:flex;gap:12px;margin-top:26px}
.pager button{flex:1;display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:var(--panel);border-radius:18px;
  padding:12px 14px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow-sm)}
.pager button:hover{border-color:var(--accent);transform:translateY(-2px)}
.pager button:disabled{opacity:.35;cursor:default;transform:none}
.pager .pav{width:44px;height:44px;flex:none}
.pager .pt{text-align:left;min-width:0}
.pager .pd{font-family:var(--disp);font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.pager .pn{font-family:var(--disp);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager .next{justify-content:flex-end;text-align:right}
.pager .next .pt{text-align:right}

.openlab{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);padding:11px 18px;
  border-radius:15px;font-family:var(--disp);font-weight:600;font-size:15px;box-shadow:var(--shadow-sm)}
.openlab:hover{text-decoration:none;transform:translateY(-2px)}

.note{margin:28px 0 0;font-size:13px;color:var(--muted);background:var(--panel2);border:2px solid var(--line);
  border-radius:16px;padding:14px 16px;line-height:1.55}
.note b{color:var(--ink);font-family:var(--disp);font-weight:600}

@media(max-width:720px){
  .way .steps{grid-template-columns:repeat(2,1fr)}
  .trail::before{left:38px}
  .stop{grid-template-columns:76px 1fr;gap:4px}
  .node{grid-column:1;justify-self:start}
  .node .av{width:64px;height:64px}
  .stop.left .card,.stop.right .card{grid-column:2;justify-self:start;max-width:none}
  .stop.left .card .wk,.stop.left .card .nm,.stop.left .card .hk{text-align:left}
  .hero{padding-top:30px}
}
@media(max-width:460px){
  .pager{flex-direction:column}
  .stars{padding:5px 10px}
  .home .wordmark{font-size:15px}
}
</style>

<div class="bar"><div class="wrap">
  <button class="home" id="homeBtn" aria-label="Back to the map">
    <span class="logo" id="logoSlot"></span>
    <span class="wordmark">LLM Hacking<small>red-team basics</small></span>
  </button>
  <span class="spacer"></span>
  <span class="stars" title="Badges earned">
    <svg viewBox="0 0 24 24" fill="var(--gold)"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
    <span id="starCount">0/7</span>
  </span>
  <button class="iconbtn" id="guideBtn" aria-label="Teacher's guide" title="Teacher's guide">📖</button>
  <button class="iconbtn" id="themeBtn" aria-label="Toggle light and dark" title="Day / night">☾</button>
</div></div>

<div class="wrap"><div class="view" id="view"></div></div>

<script>
/* ===== creature maker: one friendly family of bots, varied per lab ===== */
function creature(c){
  const h=c.hue;
  const body=`hsl(${h} 66% 60%)`, dark=`hsl(${h} 58% 42%)`, light=`hsl(${h} 86% 87%)`,
        blush=`hsl(${(h+12)%360} 82% 70%)`;
  const P=[]; // behind body
  const F=[]; // body + face + front
  // ---- tops (behind) ----
  if(c.top==='horns'){P.push(`<path d="M34 34 L30 12 L48 28 Z" fill="${dark}"/><path d="M86 34 L90 12 L72 28 Z" fill="${dark}"/>`);}
  if(c.top==='ears'){P.push(`<circle cx="34" cy="34" r="14" fill="${body}"/><circle cx="86" cy="34" r="14" fill="${body}"/><circle cx="34" cy="34" r="6" fill="${light}"/><circle cx="86" cy="34" r="6" fill="${light}"/>`);}
  if(c.top==='tuft'){P.push(`<path d="M40 30 L33 10 L52 26 Z" fill="${body}"/><path d="M80 30 L87 10 L68 26 Z" fill="${body}"/>`);}
  if(c.top==='antenna'){P.push(`<line x1="60" y1="30" x2="60" y2="12" stroke="${dark}" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="9" r="7" fill="${light}" stroke="${dark}" stroke-width="2.5"/>`);}
  // ---- body ----
  if(c.body==='round'){
    F.push(`<circle cx="60" cy="66" r="41" fill="${body}"/><ellipse cx="60" cy="76" rx="27" ry="23" fill="${light}" opacity=".45"/>`);
  }else if(c.body==='rect'){
    F.push(`<rect x="19" y="27" width="82" height="78" rx="26" fill="${body}"/><rect x="33" y="52" width="54" height="46" rx="16" fill="${light}" opacity=".4"/>`);
  }else{ // ghost

/* ===== the real threat behind each bot (loosely, the OWASP LLM Top 10) ===== */
const THREATS={
 instaglam:{tag:"Excessive agency · account takeover",
  what:"The assistant can take real, sensitive actions — recovery codes, email changes — and decides to on the strength of a prompt. Give an LLM powerful tools and loose authorization, and prompt injection becomes account takeover.",
  defend:["Put real authorization in front of every sensitive tool — identity and ownership checks in code, not in the prompt.","Require step-up verification before account-changing actions; never let the model authorize them itself.","Constrain tool arguments and destinations (codes only to the verified owner), and log every call."]},
 bingbong:{tag:"Sensitive info disclosure · prompt leak",
  what:"System prompts leak. Whatever you put in one will eventually be read by a user, so it can't be where your secrets live.",
  defend:["Never place API keys, credentials or real policy secrets in a system prompt.","Assume the prompt is public and design so leaking it costs you nothing.","Keep secrets behind an authorization check, not in the context window."]},
 gitlost:{tag:"Data exfiltration · excessive agency",
  what:"One workflow that can both read private data and post publicly can be chained into leaking it. The danger is the two powers living in one place.",
  defend:["Split privileges: reading private contents and publishing publicly shouldn't share one token.","Gate any public write behind human approval.","Allowlist where output can go; treat 'read private + write public' as a design smell."]},
 xss:{tag:"Improper output handling",
  what:"Model output is untrusted input. Drop it straight into a page and you have XSS — the AI just delivered the attacker's payload for them.",
  defend:["Use context-aware output encoding wherever model text is rendered.","Treat LLM output exactly like user input: sanitize before it touches HTML.","Add a Content-Security-Policy so a stray script can't execute."]},
 ssrf:{tag:"Server-side request forgery (SSRF)",
  what:"A fetch tool will dial any address the model picks, including internal services and cloud metadata endpoints. The model is an untrusted source of requests.",
  defend:["Allowlist outbound destinations; block private IP ranges and metadata IPs.","Validate and normalize URLs server-side before fetching.","Segment the network so the tool simply can't reach internal services."]},
 ghostcommit:{tag:"Multimodal injection",
  what:"Instructions can ride in through an image — metadata, pixels, encoded text — where your text filters never look. New modality, same broken boundary.",
  defend:["Apply the same 'data, not instructions' rule to every modality, images included.","Strip or validate image metadata before processing.","Limit what the vision agent is allowed to do with whatever it reads."]},
 abliteration:{tag:"Supply chain · model integrity",
  what:"Safety behaviour lives in the weights, and weights can be edited to strip it out. A modified or untrusted model may have had its guardrails quietly removed.",
  defend:["Never treat a model's refusals as your security control.","Verify model provenance and integrity; pin to trusted weights.","Keep the real guardrails outside the model, and monitor what comes out."]}
};

/* ===== how each trick actually works (the technical layer) ===== */
const TECH={
 instaglam:{name:"Agentic prompt injection · tool abuse",
  how:"The assistant isn't just chatting — it can call tools that act on the account (send a recovery code, change the email). Prompt injection here isn't about leaking text; it's about getting the agent to invoke a sensitive tool with attacker-chosen arguments. Pair that with a spoofed context (location/VPN) and the request reads as authorised. The impact is a full account takeover, not a disclosure."},
 bingbong:{name:"System-prompt extraction · tokenization tricks",
  how:"The hidden rules live in the system prompt. A naive filter blocks exact phrases, so you split characters, insert separators, or paraphrase — the model reassembles meaning across tokens the filter inspected one at a time. Keep extraction separate from impact: leaking the prompt is not the same as abusing a capability it protects."},
 gitlost:{name:"Injection → exfiltration via an output channel",
  how:"An automation reads public issues and holds a token that can both read private repo contents and post public comments. Your issue tells it to read something private and echo it into a public comment. The exploit chains two privileges — private read and public write — that should never sit behind one trigger."},
 xss:{name:"Stored / blind XSS via LLM output",
  how:"The model's output is rendered into an analyst's page. If it reaches an executable HTML context without encoding, your markup runs as script in their browser — ordinary XSS, except the LLM is the delivery vector. Each level renders in a different context (text, attribute, script), so the escape you need changes with it."},
 ssrf:{name:"SSRF via a tool-use fetch",
  how:"A research tool fetches whatever URL the model picks. Steer it at an internal address — a private service or a cloud metadata endpoint — and the server makes the request from inside the network. Because the response may never be shown to you, you confirm the hit from the request log: this is the 'blind' in blind SSRF."},
 ghostcommit:{name:"Multimodal · cross-modal injection",
  how:"Instructions reach a vision-capable agent through an image: PNG tEXt metadata, text rendered into pixels, a faint footer, or encoded bytes. Text-only guardrails never inspect these channels. Later levels force you to reconstruct a masked or piece-by-piece disclosure out of the review output."},
 abliteration:{name:"Refusal-direction ablation · model internals",
  how:"Refusal behaviour correlates with a single direction in the model's activation space. Estimate it from the mean activation difference between harmful and harmless prompts, then project it out — at inference (ablation) or permanently in the weights (orthogonalisation). The takeaway: safety that lives in weights can be edited away, so it is not a control you can lean on."}
};

    <div class="fw-what">${f.what}</div><div class="fw-link">Open ↗</div></a>`).join('');
  view.innerHTML=`
   <div class="view chap-fade">
    <button class="back" id="backBtn">‹ the trail</button>
    <div class="cheat-hero">
      <span class="kicker">The hard part · judging</span>
      <h1>Did it actually work?</h1>
      <p>The most common mistake in jailbreaking isn't failing — it's believing you succeeded. A model's own words are not evidence. This page is about proving it.</p>
    </div>

    <div class="jlead">
      <h3>First — do these attempts even need grading?</h3>
      <p>Mostly no, and that's the point. Most of these labs grade themselves: a flag validates, the lab accepts the word, the request log either shows the fetch or it doesn't. The lab is the judge, built that way to teach you what proof looks like. Judging becomes <b>your</b> job in three places:</p>
      <ul>
        <li><b>The open-ended lab</b> (Abliteration) — you interpret behaviour and explain edits; there's no flag to capture.</li>
        <li><b>Grading understanding</b> — the milestones ask students to <em>explain</em> the failure, not just trip a validator. A copied prompt that works proves little.</li>
        <li><b>Every real engagement</b> — nothing hands you a green checkmark. The evidence habits below are the part that transfers.</li>
      </ul>
    </div>

    <div class="block">
      <h3><span class="dot"></span>Why judging is genuinely hard (when it's on you)</h3>
      <ul class="jlist">
        <li><b>The model's self-report isn't proof.</b> It can cheerfully "play along" and invent a convincing secret it never actually had, or claim it refused while still leaking. A refusal and a real exploit both need interpreting.</li>
        <li><b>False positives look like wins.</b> A plausible-looking string, a confident "done!", an answer that merely <em>describes</em> the gated action — none of these are the action happening.</li>
        <li><b>False negatives hide real wins.</b> The model may have complied while a downstream filter rewrote the output, or you simply didn't capture the proof. "It refused" can be wrong too.</li>
        <li><b>Models are non-deterministic.</b> The same prompt can pass once and fail twice. One success is an anecdote; a rate across fresh sessions is a finding.</li>
        <li><b>Using a model to judge is shaky too.</b> An LLM grader is inconsistent, sycophantic, and can itself be prompt-injected by the very content it's scoring. Don't let one model's opinion be your ground truth.</li>
      </ul>
    </div>

    <div class="block">
      <h3><span class="dot"></span>Weak evidence vs. strong evidence</h3>
      <div class="ev-cols">
        <div class="ev weak"><h4>✗ Weak — a claim</h4><ul>
          <li>"I fetched that URL."</li><li>"I can't help with that."</li>
          <li>An output that <em>looks</em> like the secret.</li><li>The model narrating the exploit.</li></ul></div>
        <div class="ev strong"><h4>✓ Strong — a consequence</h4><ul>
          <li>A request log recording the fetch and its response.</li><li>Execution recorded in review logs.</li>
          <li>The recovered value <em>validating</em> against the lab.</li><li>Protected data appearing verbatim where it shouldn't.</li></ul></div>
      </div>
      <ul class="ev-ladder">
        <li><span class="el-k">Account takeover — Instaglam</span><span class="el-w">Weak:</span> the assistant says it'll help. <span class="el-s">Strong:</span> a recovery code reaches an address you control and the account changes hands.</li>
        <li><span class="el-k">Disclosure — BingBong, GitLost</span><span class="el-w">Weak:</span> text that resembles the secret. <span class="el-s">Strong:</span> the protected content appears verbatim where it shouldn't — a public comment, the output — and diffs against the source.</li>
        <li><span class="el-k">Blind XSS</span><span class="el-w">Weak:</span> the payload is "in there somewhere." <span class="el-s">Strong:</span> Review Logs record execution and the recovered cookie validates.</li>
        <li><span class="el-k">Blind SSRF</span><span class="el-w">Weak:</span> the assistant says it made the request. <span class="el-s">Strong:</span> the request log records the fetch and the response that holds the flag.</li>
        <li><span class="el-k">Multimodal — GhostCommit</span><span class="el-w">Weak:</span> a plausible-looking key. <span class="el-s">Strong:</span> the key reconstructs exactly and validates.</li>
      </ul>
    </div>

    <div class="block">
      <h3><span class="dot"></span>A rubric you can actually use</h3>
      <ol class="moves">
        <li><div class="mt">Define success before you start</div><div class="md">Write down the single observable thing that must happen. Decide the bar before you're invested in clearing it.</div></li>
        <li><div class="mt">Demand a consequence, not a claim</div><div class="md">A log line, a validated token, verbatim data you can diff — not the model's description of events.</div></li>
        <li><div class="mt">Capture the artifact and its source</div><div class="md">Screenshot or save the log/response and note exactly where it came from, so someone else could re-check it.</div></li>
        <li><div class="mt">Reproduce it</div><div class="md">Fresh sessions, several times. Report successes out of attempts, with the conditions that mattered.</div></li>
        <li><div class="mt">Separate the layers</div><div class="md">Did you break the guardrail, or just get the model to talk <em>about</em> breaking it? Disclosure isn't impact; impact isn't persistence.</div></li>
        <li><div class="mt">Rule out the easy fakes</div><div class="md">Hallucinated success, a cached answer, a judge that got fooled. If a skeptic could dismiss it, it isn't done.</div></li>
        <li><div class="mt">Name it in a framework</div><div class="md">Tag the OWASP / ATLAS category so the finding travels — and so a defender knows exactly what to fix.</div></li>
      </ol>
    </div>

    <div class="block">
      <h3><span class="dot"></span>Frameworks — to name what you found</h3>
      <div class="fw-grid">${fw}</div>
    </div>

    <div class="block">
      <h3><span class="dot"></span>Tools — to gather the proof for you</h3>
      <div class="fw-grid">${tl}</div>
      <div class="jcallout">
        <h3>⚖ LLM-as-judge: handle with care</h3>
        <p>It's tempting to score attempts with another model. It scales, but it drifts: graders disagree with themselves, favour confident wording, and can be injected by the output they're reading. Use a model to triage and cluster, then confirm anything that matters against ground truth — a log, a validator, a human.</p>
      </div>
    </div>

    <div class="note"><b>Frameworks and tools evolve — verify at the source.</b> The OWASP GenAI Red Teaming material, MITRE ATLAS and the NIST AI RMF / GenAI Profile (AI 600-1) are the primary references; tool capabilities and versions change often. A couple of widely-repeated details (a promptfoo acquisition, Inspect's exact origin) were only in secondary write-ups when checked — confirm before you cite them.</div>
   </div>`;
  document.getElementById('backBtn').onclick=()=>{location.hash=''};
  window.scrollTo(0,0);
}

/* ===== interactive threat-modeller for an LLM-connected app ===== */
const TM_KEY="bottricks.tm.v1";
const CAPS=[
 {id:"private_data",grp:"What it can see",ol:"Reads private / internal data",od:"Files, user records, accounts, internal services.",sev:"medium",legs:["data"],
  threat:"Anything the model can read, an injection can try to make it reveal or act on.",
  controls:["Scope every retrieval to the end-user's identity and permissions.","Keep real secrets — keys, tokens — out of the model's context entirely."]},
 {id:"untrusted",grp:"What it can see",ol:"Ingests untrusted content",od:"Web pages, emails, tickets, documents, images it didn't write.",sev:"medium",legs:["untrusted"],
  threat:"Attacker-controlled text becomes instructions — direct and indirect prompt injection.",
  controls:["Treat all ingested content as data, never instructions; spotlight or delimit it.","Assume injection will happen, and make sure one injected instruction can't cause harm."]},
 {id:"email",grp:"Tools it can call",ol:"Sends email or messages",od:"Outbound mail, chat, notifications.",sev:"high",legs:["egress"],
  threat:"An exfiltration channel and a spoofing vector — injection can mail data out, or send as you.",
  controls:["Constrain recipients to an allowlist or the verified owner; no arbitrary 'to:'.","Require confirmation for outbound mail; log every send.","Never let untrusted input set both recipient and body."]},
 {id:"code_exec",grp:"Tools it can call",ol:"Executes code",od:"Runs a code interpreter or sandbox.",sev:"critical",legs:["egress"],
  threat:"Prompt injection → arbitrary code execution. The highest-severity tool you can give an agent.",
  controls:["Run in a locked-down, network-isolated, ephemeral sandbox with least privilege.","Never execute code assembled from untrusted content outside that isolation.","Cap CPU, memory and time; no access to host secrets, env or filesystem."]},
 {id:"fetch",grp:"Tools it can call",ol:"Fetches URLs / browses",od:"HTTP requests, web browsing, link previews.",sev:"high",legs:["egress"],
  threat:"SSRF to internal services or cloud metadata, plus a data-exfil channel (data hidden in the URL).",
  controls:["Egress allowlist; block private IP ranges and metadata endpoints.","Resolve and validate hosts server-side; strip credentials from URLs.","Watch for data smuggled into outbound URLs."]},
 {id:"database",grp:"Tools it can call",ol:"Queries / writes a database",od:"SQL or NoSQL reads and writes.",sev:"high",legs:["data","egress"],
  threat:"Over-broad reads leak data; model-built queries risk injection; ungated writes corrupt state.",
  controls:["Parameterize queries; never build them from raw model output.","Scope access to the user's own rows; prefer read-only.","Gate destructive writes behind confirmation."]},
 {id:"files",grp:"Tools it can call",ol:"Reads / writes files",od:"Filesystem or object-storage access.",sev:"high",legs:["data","egress"],
  threat:"Path traversal, reading secrets, and writing attacker-controlled or executable files.",
  controls:["Jail to a per-user directory; canonicalize and validate every path.","No writes to executable or config locations.","Limit and scan what can be read or written."]},
 {id:"shell",grp:"Tools it can call",ol:"Runs shell / OS commands",od:"System commands, subprocess, package installs.",sev:"critical",legs:["egress"],
  threat:"Command injection → full host compromise. Treat it like code execution, or worse.",
  controls:["Avoid if at all possible; otherwise a strict command allowlist with no shell interpolation.","Run as an unprivileged, isolated user with no network.","Never pass untrusted strings into a shell."]},
 {id:"payments",grp:"Tools it can call",ol:"Moves money / makes purchases",od:"Charges, transfers, orders.",sev:"critical",legs:["egress"],
  threat:"Injection can trigger unauthorized transactions on your account.",
  controls:["Hard per-transaction limits and human approval.","Verify intent out-of-band; log and alert on every charge.","Never let untrusted content set amount and destination."]},
 {id:"publish",grp:"Tools it can call",ol:"Posts publicly",od:"Comments, issues, pages, social posts.",sev:"high",legs:["egress"],
  threat:"A public-write channel is both an exfiltration path and a vandalism / defamation vector.",
  controls:["Gate public writes behind approval.","Separate 'read private' and 'write public' privileges — never one token.","Content-check and rate-limit outbound posts."]},
 {id:"autonomy",grp:"How it operates",ol:"Acts without human approval",od:"Takes actions on its own, with no confirmation step.",sev:"high",legs:[],
  threat:"Removes the human checkpoint — an injected action executes immediately, at machine speed.",
  controls:["Insert approval gates for sensitive or irreversible actions.","Constrain the action space; prefer read-only autonomy.","Rate-limit, monitor, and build in a kill switch."]},
 {id:"multistep",grp:"How it operates",ol:"Chains multiple tools (agentic)",od:"Plans and calls several tools in sequence.",sev:"high",legs:[],
  threat:"One injected step can pivot through every tool the agent holds — blast radius is all capabilities combined.",
  controls:["Least privilege per step; don't hand the agent every tool at once.","Isolate tool credentials; scope tokens narrowly.","Log the full tool trace for review."]}
];
const SEV={critical:3,high:2,medium:1};
const PRESETS=[
 {name:"RAG chatbot",ids:["private_data","untrusted"]},
 {name:"Email assistant",ids:["private_data","untrusted","email"]},
 {name:"Support agent",ids:["private_data","untrusted","database","email","publish","multistep","autonomy"]},
 {name:"Coding agent",ids:["untrusted","code_exec","files","shell","fetch","multistep","autonomy"]}
];

function renderThreatModel(){
  updateStars();
  let sel; try{sel=new Set(JSON.parse(localStorage.getItem(TM_KEY))||[])}catch(e){sel=new Set()}
  const groups=[...new Set(CAPS.map(c=>c.grp))];
  const opts=groups.map(g=>`<div class="tm-grp">${g}</div>`+CAPS.filter(c=>c.grp===g).map(c=>`
    <label class="tm-opt ${sel.has(c.id)?'on':''}" data-id="${c.id}">
      <input type="checkbox" ${sel.has(c.id)?'checked':''}>
      <span class="tm-txt"><span class="ol">${c.ol}<span class="tm-sev sev-${c.sev}">${c.sev}</span></span><span class="od">${c.od}</span></span>
    </label>`).join('')).join('');
  view.innerHTML=`
   <div class="view chap-fade">
    <button class="back" id="backBtn">‹ the trail</button>
    <div class="cheat-hero">
      <span class="kicker">Build &amp; threat-model</span>
      <h1>Threat-model your LLM app</h1>
      <p>Tick what your agent can touch. It reads data, ingests untrusted content, and holds tools like email and code execution — this surfaces the attack paths and the controls that fence them.</p>
    </div>
    <div class="tm-wrap">
      <div class="tm-pick">
        <h3>What can your agent do?</h3>
        <div class="tm-presets"><span class="tm-plabel">Start from a preset</span>${PRESETS.map((p,i)=>`<button class="ghost tm-preset" data-i="${i}">${p.name}</button>`).join('')}</div>
        ${opts}
        <div class="prog-tools"><button class="ghost" id="tmCopy">Copy model</button><button class="ghost danger" id="tmReset">Clear</button><span class="backup-msg" id="tmMsg"></span></div>
      </div>
      <div class="tm-panel" id="tmPanel"></div>
    </div>
    <div class="block">
      <h3><span class="dot"></span>Three questions for every boundary</h3>
      <ul class="jlist">
        <li><b>Who reads the data?</b> Whose identity and permissions does the model borrow on each retrieval?</li>
        <li><b>Who authorizes the action?</b> When a tool fires, who actually approved it — the user, or the prompt?</li>
        <li><b>Where can output go?</b> Every egress (email, URL, post, file, payment) is a potential exfiltration channel.</li>
      </ul>
    </div>
    <div class="note"><b>A starting point, not a finished threat model.</b> Walk each trust boundary, map the real data flows, and pair this with a framework — the <a href="#judging">OWASP / ATLAS / NIST references</a> on the judging page, plus STRIDE for the non-AI parts. Selections are saved in this browser only.</div>
   </div>`;
  document.getElementById('backBtn').onclick=()=>{location.hash=''};
  const panel=document.getElementById('tmPanel');
  const persist=()=>{try{localStorage.setItem(TM_KEY,JSON.stringify([...sel]))}catch(e){}};
  const legsOf=()=>{const L={data:false,untrusted:false,egress:false};CAPS.forEach(c=>{if(sel.has(c.id))c.legs.forEach(x=>L[x]=true)});return L;};
  function paint(){
    const L=legsOf(), trifecta=L.data&&L.untrusted&&L.egress;
    const picked=CAPS.filter(c=>sel.has(c.id)).sort((a,b)=>SEV[b.sev]-SEV[a.sev]);
    let risk='—';
    if(picked.length){ if(trifecta||picked.some(c=>c.sev==='critical')) risk='Critical'; else if(picked.some(c=>c.sev==='high')) risk='High'; else risk='Medium'; }
    const lamp=(on,h,s)=>`<div class="lamp ${on?'on':''}"><div class="lh">${h}</div><div class="ls">${s}</div></div>`;
    const combos=[];
    if(sel.has('code_exec')&&sel.has('untrusted')) combos.push({h:"Untrusted content + code execution = RCE",t:"Attacker text can reach your interpreter, so an injection becomes remote code execution — the worst case. Isolate the sandbox completely (no network, no secrets, ephemeral), or remove one of the two."});
    if(sel.has('shell')&&sel.has('untrusted')) combos.push({h:"Untrusted content + shell = host compromise",t:"Never route untrusted-derived strings into a shell. Drop shell access, or lock it to a no-interpolation allowlist in an isolated, network-less user."});
    panel.innerHTML=`
      <div class="tm-tri">
        <div class="tm-trihead"><h3>Lethal trifecta</h3><span class="riskbadge risk-${risk==='—'?'none':risk.toLowerCase()}">Risk: ${risk}</span></div>
        <div class="tri-lamps">
          ${lamp(L.data,'Private data','it can read secrets')}
          ${lamp(L.untrusted,'Untrusted content','it ingests outside text')}
          ${lamp(L.egress,'A way out','it can send data out')}
        </div>
        <div class="tri-verdict ${trifecta?'lethal':'safe'}">${trifecta?'LETHAL TRIFECTA ACTIVE — a prompt injection can exfiltrate your data. Remove one leg, or put a human in front of the egress.':'All three legs are not present yet. Keep it that way: if you must add the third, gate every egress with human approval.'}</div>
      </div>
      ${combos.map(c=>`<div class="tm-find combo"><div class="tf-h">⚠ ${c.h}</div><div class="tf-threat">${c.t}</div></div>`).join('')}
      ${picked.length?picked.map(c=>`
        <div class="tm-find">
          <div class="tf-h">${c.ol}<span class="tm-sev sev-${c.sev}">${c.sev}</span></div>
          <div class="tf-threat">${c.threat}</div>
          <ul class="tf-ctrl">${c.controls.map(x=>`<li>${x}</li>`).join('')}</ul>
        </div>`).join(''):'<div class="tm-empty">Tick a capability on the left to see its threats and controls.</div>'}`;
  }
  const syncDom=()=>view.querySelectorAll('.tm-opt').forEach(l=>{const on=sel.has(l.dataset.id);l.classList.toggle('on',on);l.querySelector('input').checked=on;});
  view.querySelectorAll('.tm-opt').forEach(l=>{
    const id=l.dataset.id, box=l.querySelector('input');
    box.addEventListener('change',()=>{ if(box.checked)sel.add(id); else sel.delete(id); l.classList.toggle('on',box.checked); persist(); paint(); });
  });
  view.querySelectorAll('.tm-preset').forEach(b=>b.onclick=()=>{ sel=new Set(PRESETS[+b.dataset.i].ids); persist(); syncDom(); paint(); });
  const tmMsg=(m)=>{const el=document.getElementById('tmMsg');if(el){el.textContent=m;setTimeout(()=>{if(el)el.textContent=''},2000)}};
  document.getElementById('tmReset').onclick=()=>{ sel.clear(); persist(); syncDom(); paint(); };
  document.getElementById('tmCopy').onclick=()=>{
    const L=legsOf(), trifecta=L.data&&L.untrusted&&L.egress, picked=CAPS.filter(c=>sel.has(c.id));
    const t="LLM APP THREAT MODEL\n\nCapabilities:\n"+(picked.length?picked.map(c=>"- "+c.ol+" ["+c.sev+"]").join("\n"):"- (none selected)")+
      "\n\nLethal trifecta: "+(trifecta?"ACTIVE":"not active")+" (private data: "+(L.data?"yes":"no")+", untrusted content: "+(L.untrusted?"yes":"no")+", egress: "+(L.egress?"yes":"no")+")"+
      "\n\nThreats & controls:\n"+picked.map(c=>"• "+c.ol+"\n  threat: "+c.threat+"\n  controls:\n"+c.controls.map(x=>"    - "+x).join("\n")).join("\n\n");
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>tmMsg('Copied ✓')).catch(()=>tmMsg('Copy failed'));
    else tmMsg('Copy not available');
  };
  paint();
  window.scrollTo(0,0);
}

/* ===== hash router: makes the browser Back button move between views ===== */
function route(){
  const h=decodeURIComponent((location.hash||'').replace(/^#/,''));
  if(h==='cheatsheet'){renderCheat();return;}
  if(h==='teacher'){renderTeacher();return;}
  if(h==='judging'){renderJudge();return;}
  if(h==='threatmodel'){renderThreatModel();return;}
  const lab=LABS.find(l=>l.id===h);
  if(lab) renderChapter(lab.id); else renderMap();
}
window.addEventListener('hashchange',route);

/* tiny confetti on badge */
function confetti(){
  const cols=['#ef7a52','#e6ac34','#28b2a2','#9a7bd8','#d8614a'];
  for(let k=0;k<28;k++){
    const d=document.createElement('div');
    d.style.cssText=`position:fixed;top:64px;left:${30+Math.random()*40}%;width:9px;height:9px;z-index:60;
      background:${cols[k%cols.length]};border-radius:${Math.random()<.5?'50%':'2px'};pointer-events:none;
      transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(d);
    const dx=(Math.random()-.5)*300, dy=200+Math.random()*320, rot=Math.random()*720;
    d.animate([{transform:d.style.transform,opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${rot}deg)`,opacity:0}],
      {duration:900+Math.random()*500,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>d.remove();
  }
}

.rbody{font-size:18px;line-height:1.65}
.rbody code{font-size:15.5px}
.keynote{font-size:15.5px;line-height:1.6}

.badgebtn{font-size:19px;padding:13px 22px}
.badgebtn svg{width:24px;height:24px}
.mile{font-size:17px}
.mile b{font-size:18px}
.openlab{font-size:19px;padding:12px 20px}
.pager button{padding:14px 16px}
.pager .pd{font-size:12.5px;letter-spacing:.7px}
.pager .pn{font-size:18px}
.pager .pav{width:52px;height:52px}
.note{font-size:16.5px;line-height:1.65;padding:16px 18px}

/* four-step method tags */
.way .s .tag{font-family:var(--mono);font-weight:600;font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--teal);margin-top:5px}

/* threat modeler card */
.modeler{background:var(--panel);border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow);
  padding:26px 24px 22px;margin:18px 0 10px}
.modeler h2{font-size:27px;text-align:center}
.modeler .sub{text-align:center;color:var(--muted);font-size:17px;margin:6px auto 0;max-width:56ch}
.qs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.q{background:var(--panel2);border:2px solid var(--line);border-radius:18px;padding:16px 17px}
.q .qn{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--teal);text-transform:uppercase;letter-spacing:1.2px}
.q .qt{font-family:var(--disp);font-weight:600;font-size:21px;margin-top:1px}
.q .qd{font-size:16px;color:var(--muted);margin-top:7px;line-height:1.45}
.modeler-foot{text-align:center;color:var(--muted);font-size:16px;margin-top:20px;padding-top:15px;border-top:2px dotted var(--line)}

/* lethal trifecta card */
.trifecta{background:var(--panel);border:2px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:26px 24px 22px;margin:18px 0 10px}
.trifecta h2{font-size:27px;text-align:center}
.trifecta .sub{text-align:center;color:var(--muted);font-size:17px;margin:6px auto 0;max-width:60ch}
.legs{display:flex;align-items:stretch;gap:12px;margin-top:22px}
.leg{flex:1;background:color-mix(in srgb,var(--bad) 7%,var(--panel2));border:2px solid color-mix(in srgb,var(--bad) 28%,var(--line));border-radius:7px;padding:16px}
.leg .ln{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--bad);color:#fff;font-family:var(--disp);font-weight:700;font-size:14px}
.leg .lt{font-family:var(--disp);font-weight:600;font-size:18px;margin-top:9px;line-height:1.15}
.leg .ld{font-size:15px;color:var(--muted);margin-top:5px;line-height:1.45}
.leg-op{align-self:center;font-family:var(--disp);font-weight:700;font-size:24px;color:var(--faint);flex:none}
.trifecta-foot{text-align:center;color:var(--muted);font-size:16px;margin-top:20px;padding-top:15px;border-top:2px dotted var(--line)}
.trifecta-foot b{color:var(--bad)}
.tf-note{display:block;margin-top:6px;font-size:14.5px;color:var(--faint)}

/* threat + defense block in chapters */
.block.threat{border-color:color-mix(in srgb,var(--teal) 36%,var(--line));background:color-mix(in srgb,var(--teal) 7%,var(--panel))}
.block.threat > h3{color:var(--teal)}
.block.threat > h3 .dot{background:var(--teal)}
.ttag{display:inline-block;margin-top:12px;font-family:var(--disp);font-weight:600;font-size:15.5px;color:var(--teal);
  background:color-mix(in srgb,var(--teal) 14%,var(--panel));border:2px solid color-mix(in srgb,var(--teal) 32%,var(--line));
  border-radius:999px;padding:5px 15px}
.twhat{font-size:19.5px;line-height:1.55;margin-top:13px}
.tdef-h{font-family:var(--disp);font-weight:600;font-size:16.5px;margin-top:16px;color:var(--teal)}
.tdef{list-style:none;margin:8px 0 0;padding:0}
.tdef li{position:relative;padding:8px 0 8px 30px;font-size:17.5px;line-height:1.5;border-top:2px dotted color-mix(in srgb,var(--teal) 18%,var(--line))}
.tdef li:first-child{border-top:0}
.tdef li::before{content:"✓";position:absolute;left:3px;top:8px;color:var(--teal);font-weight:800}

/* cheat sheet CTA + grid */
.cheatcta{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px auto 0;max-width:460px;
  background:color-mix(in srgb,var(--teal) 14%,var(--panel));color:var(--teal);
  border:2px solid color-mix(in srgb,var(--teal) 34%,var(--line));border-radius:18px;padding:15px 20px;
  font-family:var(--disp);font-weight:600;font-size:19px;box-shadow:var(--shadow-sm)}
.cheatcta:hover{text-decoration:none;transform:translateY(-2px)}
.cheatcta .ci{font-size:20px}
.cheatcta .cx{margin-left:2px;font-size:22px}

.cheat-hero{text-align:center;margin-top:20px}
.cheat-hero h1{font-size:clamp(30px,6vw,44px)}
.cheat-hero p{color:var(--muted);font-size:19px;max-width:52ch;margin:10px auto 0;line-height:1.55}
.cheat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}
.cheat{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column}
.cheat-top{display:flex;align-items:center;gap:13px}
.cheat-av{width:56px;height:56px;flex:none;background:var(--panel2);border:2px solid var(--line2);border-radius:16px;padding:4px}
.cheat-nm{font-family:var(--disp);font-weight:600;font-size:21px;line-height:1.1}
.cheat-sub{font-size:14.5px;color:var(--muted);margin-top:1px}
.cheat .ttag{margin-top:13px;align-self:flex-start}
.cheat-what{font-size:16.5px;line-height:1.5;margin-top:12px;color:var(--ink)}
.cheat .tdef{margin-top:12px}
.cheat .tdef li{font-size:16px;padding:6px 0 6px 28px}
.cheat .tdef li::before{top:6px}

/* a violet accent for the "technique" layer, and a readable gold for judging */
:root{--plum:#7d5fc0;--goldink:#a9781a;--info:#3b74c4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--plum:#b79bf0;--goldink:#f0c45e;--info:#7fb0ef}}
:root[data-theme="dark"]{--plum:#b79bf0;--goldink:#f0c45e;--info:#7fb0ef}

/* chapter header actions (open lab + mark complete) */
.chap-actions{display:flex;flex-direction:row;gap:12px;margin-top:16px}
.act{flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:12px 16px;
  font-family:var(--disp);font-weight:600;font-size:15.5px;cursor:pointer;border:2px solid var(--line2);
  white-space:nowrap;box-shadow:var(--shadow-sm)}
.act-lab{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.act-lab:hover{text-decoration:none;transform:translateY(-2px)}
.act-done{background:var(--panel);color:var(--ink)}
.act-done:hover{transform:translateY(-2px);border-color:var(--gold)}
.act-done.got{background:var(--gold);border-color:var(--gold);color:#5a3d00}
.act-done svg{width:19px;height:19px}
.milenote{font-size:15.5px;color:var(--muted);background:var(--panel2);border:2px solid var(--line);
  border-radius:14px;padding:13px 16px;margin-top:22px}
.milenote b{color:var(--ink);font-family:var(--disp);font-weight:600}

/* "does this even need grading?" lead box */
.jlead{background:color-mix(in srgb,var(--info) 9%,var(--panel));border:2px solid color-mix(in srgb,var(--info) 30%,var(--line));border-radius:20px;padding:18px 20px;margin-top:18px}
.jlead h3{font-family:var(--disp);font-size:20px;color:var(--info)}
.jlead p{font-size:17px;line-height:1.55;margin-top:8px}
.jlead ul{margin:10px 0 0;padding-left:20px}
.jlead li{font-size:16px;line-height:1.5;margin:7px 0}

/* judging page */
.jlist{margin:10px 0 0;padding-left:20px}
.jlist li{font-size:17.5px;line-height:1.55;margin:9px 0}
.ev-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.ev{border-radius:16px;padding:14px 16px;border:2px solid var(--line)}
.ev.weak{background:color-mix(in srgb,var(--bad) 9%,var(--panel));border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
.ev.strong{background:color-mix(in srgb,var(--good) 9%,var(--panel));border-color:color-mix(in srgb,var(--good) 30%,var(--line))}
.ev h4{font-family:var(--disp);font-size:17.5px}
.ev.weak h4{color:var(--bad)}.ev.strong h4{color:var(--good)}
.ev ul{margin:8px 0 0;padding-left:18px}
.ev li{font-size:15.5px;margin:5px 0;line-height:1.45}
.ev-ladder{list-style:none;margin:16px 0 0;padding:0}
.ev-ladder li{padding:11px 0;border-top:2px dotted var(--line);font-size:16.5px;line-height:1.5}
.ev-ladder li:first-child{border-top:0}
.ev-ladder .el-k{font-family:var(--disp);font-weight:600;display:block;margin-bottom:2px}
.ev-ladder .el-w{color:var(--bad);font-weight:700}.ev-ladder .el-s{color:var(--good);font-weight:700}
.fw-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px}
.fw{background:var(--panel2);border:2px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.fw:hover{text-decoration:none;border-color:var(--accent);transform:translateY(-2px)}
.fw-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.fw-nm{font-family:var(--disp);font-weight:600;font-size:18px;color:var(--ink)}
.fw-tag{font-family:var(--mono);font-size:11.5px;color:var(--goldink);white-space:nowrap}
.fw-what{font-size:15.5px;color:var(--muted);margin-top:8px;line-height:1.5;flex:1}
.fw-link{margin-top:10px;font-family:var(--disp);font-weight:600;font-size:14px;color:var(--accent)}
.jcallout{background:color-mix(in srgb,var(--warm) 10%,var(--panel));border:2px solid color-mix(in srgb,var(--warm) 32%,var(--line));border-radius:18px;padding:16px 18px;margin-top:18px}
.jcallout h3{font-family:var(--disp);font-size:18px;color:var(--warm)}
.jcallout p{font-size:16px;margin-top:6px;line-height:1.55}
.cta.gold{background:color-mix(in srgb,var(--gold) 14%,var(--panel));border-color:color-mix(in srgb,var(--gold) 32%,var(--line))}
.cta.gold b{color:var(--goldink)}
.cta.coral{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 32%,var(--line))}
.cta.coral b{color:var(--accent)}

/* threat-modeller page */
.tm-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:18px;margin-top:22px;align-items:start}
.tm-pick{background:var(--panel);border:2px solid var(--line);border-radius:9px;padding:20px 22px;box-shadow:var(--shadow-sm);position:sticky;top:76px}
.tm-pick h3,.tm-panel h3{font-family:var(--disp);font-weight:600;font-size:18px}
.tm-presets{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:11px}
.tm-plabel{font-family:var(--mono);font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);width:100%;margin-bottom:2px}
.tm-preset{font-size:13px}
.tm-grp{font-family:var(--mono);font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.tm-opt{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;border:2px solid var(--line);border-radius:7px;margin-top:8px;cursor:pointer;background:var(--panel2)}
.tm-opt:hover{border-color:var(--line2)}
.tm-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.tm-opt input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none;cursor:pointer}
.tm-txt{min-width:0}
.tm-opt .ol{font-family:var(--disp);font-weight:600;font-size:15.5px;display:block}
.tm-opt .od{font-size:13.5px;color:var(--muted);margin-top:1px;line-height:1.4;display:block}
.tm-sev{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:2px 6px;border-radius:4px;margin-left:8px;vertical-align:middle;font-weight:600}
.sev-critical{background:color-mix(in srgb,var(--bad) 18%,var(--panel));color:var(--bad)}
.sev-high{background:color-mix(in srgb,var(--warm) 20%,var(--panel));color:var(--warm)}
.sev-medium{background:color-mix(in srgb,var(--gold) 20%,var(--panel));color:var(--goldink)}
.tm-panel{display:flex;flex-direction:column;gap:14px}
.tm-tri{background:var(--panel);border:2px solid var(--line);border-radius:9px;padding:18px 20px;box-shadow:var(--shadow-sm)}
.tm-trihead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tm-trihead h3{margin:0}
.riskbadge{font-family:var(--disp);font-weight:700;font-size:13px;padding:4px 11px;border-radius:6px;border:2px solid var(--line);color:var(--muted)}
.risk-critical{background:color-mix(in srgb,var(--bad) 15%,var(--panel));color:var(--bad);border-color:var(--bad)}
.risk-high{background:color-mix(in srgb,var(--warm) 15%,var(--panel));color:var(--warm);border-color:color-mix(in srgb,var(--warm) 40%,var(--line))}
.risk-medium{background:color-mix(in srgb,var(--gold) 15%,var(--panel));color:var(--goldink)}
.tri-lamps{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.lamp{flex:1;min-width:130px;border:2px solid var(--line);border-radius:7px;padding:11px 12px;text-align:center;background:var(--panel2);opacity:.45;transition:opacity .15s}
.lamp.on{opacity:1;border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.lamp .lh{font-family:var(--disp);font-weight:600;font-size:14.5px}
.lamp .ls{font-size:12.5px;color:var(--muted);margin-top:2px}
.tri-verdict{margin-top:14px;padding:12px 14px;border-radius:7px;font-size:15px;line-height:1.5;font-weight:500}
.tri-verdict.safe{background:color-mix(in srgb,var(--good) 10%,var(--panel));border:2px solid color-mix(in srgb,var(--good) 30%,var(--line));color:var(--good)}
.tri-verdict.lethal{background:color-mix(in srgb,var(--bad) 12%,var(--panel));border:2px solid var(--bad);color:var(--bad);font-weight:700}
.tm-find{border:2px solid var(--line);border-radius:7px;padding:14px 16px;background:var(--panel);box-shadow:var(--shadow-sm)}
.tm-find.combo{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--panel))}
.tm-find .tf-h{font-family:var(--disp);font-weight:600;font-size:16.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tm-find.combo .tf-h{color:var(--bad)}
.tm-find .tf-threat{font-size:15px;margin-top:6px;line-height:1.5}
.tm-find .tf-ctrl{list-style:none;margin:11px 0 0;padding:0}
.tm-find .tf-ctrl li{position:relative;padding:5px 0 5px 24px;font-size:14.5px;line-height:1.45}
.tm-find .tf-ctrl li::before{content:"✓";position:absolute;left:2px;top:5px;color:var(--good);font-weight:800}
.tm-empty{color:var(--muted);font-size:15px;padding:26px 20px;text-align:center;border:2px dashed var(--line);border-radius:7px}

/* technique block */
.block.tech{border-color:color-mix(in srgb,var(--plum) 34%,var(--line));background:color-mix(in srgb,var(--plum) 7%,var(--panel))}
.block.tech > h3{color:var(--plum)}
.block.tech > h3 .dot{background:var(--plum)}
.techname{display:inline-block;margin-top:12px;font-family:var(--mono);font-weight:600;font-size:14px;color:var(--plum);
  background:color-mix(in srgb,var(--plum) 13%,var(--panel));border:2px solid color-mix(in srgb,var(--plum) 30%,var(--line));
  border-radius:10px;padding:5px 12px;letter-spacing:.2px}
.techhow{font-size:18px;line-height:1.6;margin-top:13px}

/* ghost buttons */
.ghost{border:2px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:11px;padding:7px 13px;
  font-family:var(--disp);font-weight:600;font-size:13.5px;cursor:pointer}
.ghost:hover{border-color:var(--accent);transform:translateY(-1px)}
.ghost.danger:hover{border-color:var(--bad)}
.ghost.danger-on{background:var(--bad);border-color:var(--bad);color:#fff}

/* progress card */
.prog{display:flex;gap:22px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:26px;
  box-shadow:var(--shadow);padding:22px 24px;margin:18px 0 10px;flex-wrap:wrap}
.prog-ring{position:relative;width:118px;height:118px;flex:none}
.prog-ring svg{width:100%;height:100%}
.prog-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.prog-num b{font-family:var(--disp);font-weight:700;font-size:38px;color:var(--ink)}
.prog-num span{font-family:var(--disp);font-size:13px;color:var(--muted);margin-top:2px}
.prog-body{flex:1;min-width:230px}
.prog-h{font-family:var(--disp);font-weight:600;font-size:22px}
.prog-sub{color:var(--muted);font-size:16px;margin-top:2px}
.trks{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.trk{display:flex;align-items:center;gap:12px;justify-content:space-between}
.trk-n{font-family:var(--disp);font-weight:600;font-size:14.5px}
.trk-dots{display:flex;align-items:center;gap:6px}
.pdot{width:11px;height:11px;border-radius:50%;background:var(--line2);transition:background .2s}
.pdot.on{background:var(--gold)}
.trk-c{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:4px}
.prog-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.backup{margin-top:12px}
.backup-h{font-size:13.5px;color:var(--muted);margin-bottom:6px}
.backup textarea{min-height:52px;font-size:12px}
.backup-msg{font-family:var(--disp);font-size:13px;color:var(--good)}

/* CTA row */
.cta-row{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap}
.cta{flex:1;min-width:240px;display:flex;align-items:center;gap:13px;border-radius:18px;padding:15px 18px;
  box-shadow:var(--shadow-sm);border:2px solid var(--line)}
.cta:hover{text-decoration:none;transform:translateY(-2px)}
.cta .ci{font-size:26px;flex:none}
.cta .ct{display:flex;flex-direction:column;line-height:1.2}
.cta .ct b{font-family:var(--disp);font-weight:600;font-size:18px}
.cta .ct em{font-style:normal;font-size:14px;color:var(--muted);margin-top:1px}
.cta.teal{background:color-mix(in srgb,var(--teal) 12%,var(--panel));border-color:color-mix(in srgb,var(--teal) 32%,var(--line))}
.cta.teal b{color:var(--teal)}
.cta.plum{background:color-mix(in srgb,var(--plum) 12%,var(--panel));border-color:color-mix(in srgb,var(--plum) 32%,var(--line))}
.cta.plum b{color:var(--plum)}

/* teacher guide */
.tg-hero{text-align:center;margin-top:18px}
.tg-hero h1{font-size:clamp(30px,6vw,44px);margin-top:12px}
.tg-hero p{color:var(--muted);font-size:18px;max-width:58ch;margin:10px auto 0;line-height:1.55}
.tg-how{background:var(--panel);border:2px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:24px;margin-top:22px}
.tg-how h2{font-size:24px;text-align:center}
.tg-how-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 22px;margin-top:18px}
.tg-k{font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--accent)}
.tg-k.go{color:var(--good)}.tg-k.teal{color:var(--teal)}.tg-k.warn{color:var(--warm)}
.tg-how-grid p{font-size:16px;margin:5px 0 0;line-height:1.5}
.tg-toc{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px}
.toc-i{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:2px solid var(--line);border-radius:11px;
  padding:6px 12px;font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink)}
.toc-i:hover{text-decoration:none;border-color:var(--accent)}
.toc-i span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tg-list{display:flex;flex-direction:column;gap:18px;margin-top:12px}
.tg{background:var(--panel);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow-sm);padding:20px 22px;scroll-margin-top:84px}
.tg-head{display:flex;align-items:center;gap:14px}
.tg-av{width:58px;height:58px;flex:none;background:var(--panel2);border:2px solid var(--line2);border-radius:16px;padding:4px}
.tg-id{flex:1;min-width:0}
.tg-ch{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tg-time{color:var(--accent)}.tg-done{color:var(--good)}
.tg-nm{font-family:var(--disp);font-weight:600;font-size:23px;margin-top:1px}
.tg-nm .tg-sub{font-size:15px;color:var(--muted);font-weight:400}
.tg-open{font-family:var(--disp);font-weight:600;font-size:14px;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--ink);flex:none}
.tg-open:hover{text-decoration:none;border-color:var(--accent)}
.tg-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px;margin-top:16px}
.tg-col p{font-size:16px;line-height:1.5;margin:5px 0 0}
.tg-col .tg-k{margin-top:16px}
.tg-col .tg-k:first-child{margin-top:0}
.tg-ol{margin:6px 0 0;padding-left:20px}
.tg-ol li{font-size:15.5px;line-height:1.5;margin:5px 0}
.tg-note{font-size:14px;color:var(--muted);margin-top:10px}
.tg-q{font-style:italic}
.tg .tdef{margin-top:6px}
.tg .tdef li{font-size:15.5px;padding:5px 0 5px 26px}
.tg .tdef li::before{top:5px}

/* phase chip + "when to reach for it" */
.chip.phase{background:color-mix(in srgb,var(--plum) 14%,var(--panel2));border-color:color-mix(in srgb,var(--plum) 32%,var(--line));color:var(--plum)}
.techwhen{margin-top:14px;padding-top:13px;border-top:2px dotted color-mix(in srgb,var(--plum) 22%,var(--line));font-size:17px;line-height:1.5}
.techwhen .tw-k{display:block;font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.3px;color:var(--plum);margin-bottom:4px}

/* lifecycle card */
.life{background:var(--panel);border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:24px;margin:18px 0 10px}
.life h2{font-size:27px;text-align:center}
.life .sub{text-align:center;color:var(--muted);font-size:17px;margin:6px auto 0;max-width:62ch}
.life-rail{display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding:18px 2px 12px;scrollbar-width:thin}
.life-ph{min-width:168px;flex:1 0 168px;background:var(--panel2);border:2px solid var(--line);border-radius:18px;padding:13px 14px;display:flex;flex-direction:column}
.life-top{display:flex;align-items:center;gap:9px}
.life-n{width:28px;height:28px;flex:none;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-family:var(--disp);font-weight:700;font-size:15px;display:grid;place-items:center}
.life-l{font-family:var(--disp);font-weight:600;font-size:16px;line-height:1.1}
.life-b{font-size:13.5px;color:var(--muted);margin-top:7px;line-height:1.4;flex:1}
.life-bots{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.life-bot{width:36px;height:36px;display:block;background:var(--panel);border:2px solid var(--line2);border-radius:11px;padding:2px;transition:transform .15s,border-color .15s}
.life-bot:hover{transform:translateY(-2px);border-color:var(--accent)}
.life-none{font-size:13px;color:var(--faint);font-style:italic;align-self:center}
.life-arrow{align-self:center;color:var(--faint);font-size:22px;font-family:var(--disp);flex:none}
.life-foot{text-align:center;color:var(--muted);font-size:15.5px;margin-top:10px;padding-top:14px;border-top:2px dotted var(--line)}
.life-foot b{color:var(--accent)}

/* teacher phase / when / arc */
.tg-phase{color:var(--plum)}
.tg-when{font-size:15.5px!important;background:color-mix(in srgb,var(--plum) 9%,var(--panel2));border-radius:10px;padding:8px 11px;margin-top:8px!important;line-height:1.45}
.tg-arc{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:8px}
.tg-arcp{font-family:var(--disp);font-weight:600;font-size:13.5px;background:var(--panel2);border:2px solid var(--line);border-radius:9px;padding:5px 10px}
.tg-arcp b{color:var(--accent);margin-right:4px}
.tg-arcd{color:var(--faint);font-size:14px}

/* cheat tags row */
.cheat-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.cheat .ttag{margin-top:0}

/* ---- serious pass: sharper corners, flatter, more technical ---- */
.way,.modeler,.life,.prog,.block,.bubble,.cta,.jlead,.jcallout,.note,
details.rev,.tg,.tg-how,.milenote,.ev,.fw,.cheat,.card,.pager button,
textarea,.q{border-radius:9px}
.chip,.need,.bag .it,.stars,.iconbtn,.ghost,.seg,.act,.toc-i,.tg-open,
.tg-arcp,.kicker,.ttag,.techname,.cheat-av,.tg-av,.life-bot,
.way .s .b,.moves li::before,.life-n{border-radius:6px}
.chap-hero .big{border-radius:10px}
details.rev > summary .ic{border-radius:5px}
details.rev > summary .cap{border-radius:4px}
.kicker{font-weight:500}
.chip,.need{font-weight:500}
details.rev > summary .ic{font-family:var(--mono);font-weight:700;color:var(--accent)}
.cta .ci{font-family:var(--mono);font-weight:700;font-size:22px}

@media(max-width:720px){
  body{font-size:18px}
  .hero p{font-size:20px}
  .bubble,.guard{font-size:19px}
  .qs{grid-template-columns:1fr}
  .cheat-grid{grid-template-columns:1fr}
  .tg-how-grid{grid-template-columns:1fr}
  .tg-grid{grid-template-columns:1fr}
  .prog{gap:16px}
  .life-ph{min-width:154px;flex-basis:154px}
  .ev-cols{grid-template-columns:1fr}
  .fw-grid{grid-template-columns:1fr}
  .legs{flex-direction:column}
  .leg-op{transform:rotate(90deg)}
  .tm-wrap{grid-template-columns:1fr}
  .tm-pick{position:static}
}
</style>
</body></html>
